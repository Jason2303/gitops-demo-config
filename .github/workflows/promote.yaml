name: Promote to production

# Manual, approved promotion. Opens a PR that copies the image tag into the production overlay.
# Gate 1: the `production` GitHub Environment requires a reviewer to approve this job.
# Gate 2: the PR must be approved by CODEOWNERS (branch protection on main).
# Gate 3: ArgoCD production app is manual-sync; a release manager clicks Sync.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to promote, e.g. sha-1a2b3c4 (leave blank = current staging tag)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Resolve image and tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}       # passed via env, never interpolated into the script
        run: |
          STAGING=apps/demo-app/overlays/staging/kustomization.yaml
          IMAGE=$(yq '.images[] | select(.name=="demo-app") | .newName' "$STAGING")
          TAG="${INPUT_TAG:-$(yq '.images[] | select(.name=="demo-app") | .newTag' "$STAGING")}"
          if [[ ! "$TAG" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::error::Refusing to promote non-immutable tag '$TAG'"; exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"

      - name: Update production overlay
        working-directory: apps/demo-app/overlays/production
        run: kustomize edit set image demo-app=${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.tag }}

      - name: Open promotion PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/production-${{ steps.resolve.outputs.tag }}
          commit-message: "promote(production): demo-app ${{ steps.resolve.outputs.tag }}"
          title: "promote(production): demo-app ${{ steps.resolve.outputs.tag }}"
          body: |
            Promotes `${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.tag }}` (verified on staging) to **production**.

            After merge, ArgoCD shows `demo-app-production` as **OutOfSync**.
            A release manager must review the diff in ArgoCD and click **Sync**.

            Requested by @${{ github.actor }}
          labels: promotion, production
