name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.4.3"

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render overlay
        run: kustomize build apps/demo-app/overlays/${{ matrix.env }} > rendered.yaml

      - name: Schema validation
        run: kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

      - name: Policy - no plain Secrets in Git
        run: |
          if yq -e 'select(.kind == "Secret")' rendered.yaml >/dev/null 2>&1; then
            echo "::error::Plain Kubernetes Secret found. Use SealedSecret/ExternalSecret."; exit 1
          fi

      - name: Policy - image must be pinned to an immutable sha tag
        if: matrix.env == 'production'
        run: |
          tag=$(yq '.images[] | select(.name=="demo-app") | .newTag' apps/demo-app/overlays/production/kustomization.yaml)
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{7}$ ]]; then
            echo "::warning::Production tag '$tag' is not an immutable sha-xxxxxxx tag"
          fi
