# One definition -> two Applications: demo-app-staging and demo-app-production.
# Staging: automated sync + prune + selfHeal.  Production: manual sync only.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Deleting the ApplicationSet must never delete production workloads.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - env: staging
            namespace: demo-staging
            autoSync: true
          - env: production
            namespace: demo-production
            autoSync: false
  template:
    metadata:
      name: "demo-app-{{.env}}"
      labels:
        app.kubernetes.io/part-of: demo-app
        environment: "{{.env}}"
      annotations:
        # Notifications (see argocd/notifications/) -> Slack incoming webhook
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack-webhook: ""
        notifications.argoproj.io/subscribe.on-sync-failed.slack-webhook: ""
        notifications.argoproj.io/subscribe.on-health-degraded.slack-webhook: ""
    spec:
      project: demo
      source:
        repoURL: https://github.com/YOUR_GH_USER/gitops-demo-config.git
        targetRevision: main
        path: "apps/demo-app/overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      revisionHistoryLimit: 10
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            environment: "{{.env}}"
  # Per-environment sync policy. Must render valid YAML in both branches.
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
    {{- else }}
    metadata:
      labels:
        sync-mode: manual
    spec:
      # HPA owns replicas in production; don't report that as drift.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
    {{- end }}
