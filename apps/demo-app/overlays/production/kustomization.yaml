apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-production

resources:
  - ../../base
  - pdb.yaml
  - hpa.yaml

labels:
  - pairs:
      environment: production
    includeSelectors: false

configMapGenerator:
  - name: demo-app-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn

patches:
  - path: patch-deployment.yaml

# Changed ONLY by the "Promote to production" workflow (PR + approval).
images:
  - name: demo-app
    newName: ghcr.io/jason2303/gitops-demo-app
    newTag: latest
